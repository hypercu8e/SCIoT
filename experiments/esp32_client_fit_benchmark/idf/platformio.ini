[platformio]
default_envs = espnn

[env:espnn]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv

monitor_speed = 115200
build_flags = -DBENCH_ESP_NN=1

; Same firmware, Wi-Fi and lwIP buffers allocated in PSRAM first.
[env:psramnet]
extends = env:espnn
board_build.cmake_extra_args = "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.psramnet"
