; Isolated probe for ESP32-S3-EYE (N8R8): no camera, LCD, Wi-Fi or SCIoT state.
[platformio]
default_envs = prefix

[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
lib_deps = tanakamasayuki/TensorFlowLite_ESP32@1.0.0
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARENA_BYTES=524288
    -DARENA_IN_PSRAM=1

[env:full]
build_flags = ${env.build_flags} -DMODEL_STAGE=0

[env:prefix]
build_flags = ${env.build_flags} -DMODEL_STAGE=1

[env:suffix]
build_flags = ${env.build_flags} -DMODEL_STAGE=2

